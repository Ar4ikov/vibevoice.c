<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 34.5 598 73" width="598" height="73"
     role="img" aria-label="vibevoice.c">
  <title>vibevoice.c</title>
  <!--
    Primary lockup, for light surfaces. Geometry and rules: docs/BRAND.md.

    Coordinates are the wordmark's: baseline y=100, x-height top y=60,
    ascender y=42, monoline stroke 7, every bowl a circle of r=20. The mark
    is scaled 1.354 so that it spans exactly the wordmark's ink, ascender to
    baseline overshoot, and is set one half cap height (33) away from it.
  -->
  <g transform="translate(0 38.5) scale(1.354)">
    <g fill="none" stroke="#0B0D12" stroke-width="8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4 L19 44 L34 4"/>
      <path d="M47.9 4 L37.4 32"/>
      <path d="M61.8 4 L55.05 22"/>
    </g>
    <circle cx="61.8" cy="44" r="4" fill="#0E9E74"/>
  </g>

  <g transform="translate(122.4 0)">
    <!-- vibevoice -->
    <g fill="none" stroke="#0B0D12" stroke-width="7"
       stroke-linecap="round" stroke-linejoin="round">
      <path   transform="translate(0,0)"   d="M3.5 60 L20.5 100 L37.5 60"/>
      <path   transform="translate(50,0)"  d="M3.5 60 L3.5 100"/>
      <path   transform="translate(66,0)"  d="M3.5 42 L3.5 100"/>
      <circle transform="translate(66,0)"  cx="23.5" cy="80" r="20"/>
      <path   transform="translate(122,0)" d="M3.5 80 L43.5 80 A20 20 0 1 0 38.82 92.86"/>
      <path   transform="translate(178,0)" d="M3.5 60 L20.5 100 L37.5 60"/>
      <circle transform="translate(228,0)" cx="23.5" cy="80" r="20"/>
      <path   transform="translate(284,0)" d="M3.5 60 L3.5 100"/>
      <path   transform="translate(300,0)" d="M38.82 67.14 A20 20 0 1 0 38.82 92.86"/>
      <path   transform="translate(353,0)" d="M3.5 80 L43.5 80 A20 20 0 1 0 38.82 92.86"/>
    </g>
    <g fill="#0B0D12">
      <circle cx="53.5" cy="48" r="3.5"/>
      <circle cx="287.5" cy="48" r="3.5"/>
    </g>
    <!-- .c -->
    <circle cx="412.5" cy="96.5" r="3.5" fill="#0E9E74"/>
    <g fill="none" stroke="#0E9E74" stroke-width="7" stroke-linecap="round">
      <path transform="translate(425,0)" d="M38.82 67.14 A20 20 0 1 0 38.82 92.86"/>
