backend_name: vibevoice-custom
description: VibeVoice ASR (7B, Streaming-7B, BitNet) in C with CUDA, diarization, multi-GPU and bounded FIFO admission
default_version: latest
health_check_path: /health
parameter_format: space
# --gpus all is every GPU GPUStack assigned to the replica and no other: the
# worker exposes them through CUDA_VISIBLE_DEVICES, renumbered from 0 inside
# the container. Not {{gpu_ids}}, which are host indexes.
default_run_command: 'serve --model "{{model_path}}" --host 0.0.0.0 --port {{port}} --model-name "{{model_name}}" --gpus all'
default_backend_param:
  - --slots 1
  - --queue-size 16
  - --kv-cache tq4
  - --max-seq-len 32768
# Every serve option a deployment may set. --model, --host, --port and
# --model-name come from the run command; --api-key is GPUStack's job.
common_parameters:
  - --slots
  - --queue-size
  - --max-conns
  - --kv-cache
  - --max-seq-len
  - --quant
  - --attn
  - --kv-paged
  - --split-mode
  - --gpu-memory
  - --gpus
  - --gpu-layers
  - --vram-budget
  - --acoustic-sampling
  - --calib
  - --calib-stats
  - --vae
  - --source
  - --head
  - --stream-reserve
  - --stream-idle
  - --stream-slot-wait
  - --cpu
  - --verbose
default_env:
  OMP_NUM_THREADS: '8'
# One entry per image tag the deployment can be pinned to. GET /health on the
# running backend reports which build actually answered. The Release workflow
# adds a release line the first time it is published; see docs/RELEASING.md.
version_configs:
  # Newest release. The default.
  latest:
    image_name: ghcr.io/ar4ikov/turboqwen:latest
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # The 0.5 release line: newest v0.5.x, moves when a patch is tagged.
  '0.5':
    image_name: ghcr.io/ar4ikov/turboqwen:0.5
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # The 0.4 release line: newest v0.4.x, moves when a patch is tagged.
  '0.4':
    image_name: ghcr.io/ar4ikov/turboqwen:0.4
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # The 0.3 release line: newest v0.3.x, moves when a patch is tagged.
  '0.3':
    image_name: ghcr.io/ar4ikov/turboqwen:0.3
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # The 0.2 release line: newest v0.2.x, moves when a patch is tagged.
  '0.2':
    image_name: ghcr.io/ar4ikov/turboqwen:0.2
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # Head of the default branch, republished on every push to master. Each of
  # those builds is also published under its own version, e.g. 0.2.1-dev.5.
  master:
    image_name: ghcr.io/ar4ikov/turboqwen:master
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
