backend_name: vibevoice-custom
description: VibeVoice ASR in C with CUDA, diarization and bounded FIFO admission
default_version: latest
health_check_path: /health
parameter_format: space
default_run_command: 'serve --model "{{model_path}}" --host 0.0.0.0 --port {{port}} --model-name "{{model_name}}"'
default_backend_param:
  - --slots 1
  - --queue-size 16
  - --kv-cache tq4
  - --max-seq-len 32768
common_parameters:
  - --slots
  - --queue-size
  - --max-conns
  - --kv-cache
  - --max-seq-len
  - --gpu-layers
  - --vram-budget
default_env:
  OMP_NUM_THREADS: '8'
# One entry per image tag the deployment can be pinned to. GET /health on the
# running backend reports which build actually answered. A release line only
# appears here after its first v* tag is published; see docs/RELEASING.md.
version_configs:
  # Newest published build, release or master. The default.
  latest:
    image_name: ghcr.io/ar4ikov/vibevoice.c:latest
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # The 0.1 release line: newest v0.1.x, moves when a patch is tagged.
  '0.1':
    image_name: ghcr.io/ar4ikov/vibevoice.c:0.1
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
  # Head of the default branch, republished on every push to master.
  master:
    image_name: ghcr.io/ar4ikov/vibevoice.c:master
    entrypoint: /usr/local/bin/vv_cli
    custom_framework: cuda
